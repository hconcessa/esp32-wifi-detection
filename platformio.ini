; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = rx

[env]
platform = espressif32@6.13.0
framework = espidf

; Universal TX demo
[env:tx]
board = esp32-c3-devkitm-1
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200

board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.tx.defaults

; RX demo
[env:rx]
board = esp32dev
upload_port = COM6
monitor_port = COM6
monitor_speed = 921600

board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.rx.defaults

; ---------------------------------------------------------------------------
; See src/rx/firmware_config.h
; Dataset capture: CSI_SIG + CSI_F12 in all windows (without calibration)
[env:rx_capture]
extends = env:rx
build_flags = -DCSI_FIRMWARE_MODE=1

; Test and Validation: + CSI_STATE and CSI_VEC (inputs/outputs int8) in all windows
[env:rx_validation]
extends = env:rx
build_flags = -DCSI_FIRMWARE_MODE=2
